<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>多 Agent 群聊房间</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="room-info">
      <h1 id="room-title">群聊房间</h1>
      <span id="room-status" class="status idle">待机</span>
    </div>
    <div class="controls">
      <button id="btn-nudge" class="btn primary">让 Agent 们自由讨论</button>
      <button id="btn-pause" class="btn">暂停</button>
      <button id="btn-reset" class="btn danger">清空记录</button>
    </div>
  </header>

  <main class="layout">
    <section class="chat">
      <ol id="messages" class="messages" aria-live="polite"></ol>
      <form id="composer" class="composer">
        <input id="input" type="text" placeholder="以主持人身份说点什么，Agent 们会自己决定谁接话…" maxlength="500" autocomplete="off" />
        <button type="submit" class="btn primary">发送</button>
      </form>
    </section>

    <aside class="sidebar">
      <h2>房间成员 <span id="agent-count" class="muted"></span></h2>
      <ul id="agents" class="agents"></ul>
      <div class="legend">
        <h3>规则</h3>
        <p>每条消息后，10 位 Agent 各自判断是否想接话；上一位发言者的提名优先，否则按发言意愿加权随机。默认不设条数上限——直到所有人都无意接话，或你点击暂停。</p>
      </div>
    </aside>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
